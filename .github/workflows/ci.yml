name: CI

on:
  pull_request:
    # labeled/unlabeled: the release note check reads the no-release-note label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/changelog.test.ts checks that the notes' image URLs name commits in this branch's history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # user-visible-change-has-a-note (scripts/check-release-note.mjs).
      - name: Release note check
        if: github.event_name == 'pull_request'
        run: node scripts/check-release-note.mjs
      # npm run verify includes the scale check, which drives a real (isolated) Paseo daemon.
      # The same CLIs and checks as the publish workflow: a PR passes exactly the gate a release must pass
      # (tests/publish-gate.test.ts). 2026-11-11: test:install ran only at publish, and v2.0.0-rc.3 failed there.
      - name: Install CLIs for isolated integration checks
        run: npm install --global @getpaseo/cli@0.15.2 @anthropic-ai/claude-code@2.1.300 @openai/codex@0.162.1
      - run: npm run verify
      - run: npm run test:install
      - run: npm pack --dry-run

  # Its own job, in parallel with verify: the live-sized run alone takes about 20 minutes, and in series it made every
  # PR wait for both. Both jobs are required.
  scale-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same CLIs as verify: the scale check drives a real (isolated) Paseo daemon.
      - name: Install CLIs for isolated integration checks
        run: npm install --global @getpaseo/cli@0.15.2 @anthropic-ai/claude-code@2.1.300 @openai/codex@0.162.1
      # The live-sized busy window (live's outliers, 20 turns/min). It reports its RSS, CPU and request budgets without
      # failing until the derived budgets land (scripts/scale-check.mjs --budgets-report-only); wakes and sends still fail.
      - run: npm run test:scale:live
