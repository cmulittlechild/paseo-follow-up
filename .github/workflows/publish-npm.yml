name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Require the tagged commit to be on main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Require the tag to match package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Verify npm trusted publishing authorization
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { name } = JSON.parse(readFileSync("package.json", "utf8"));
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set("audience", "npm:registry.npmjs.org");
          const identity = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, signal: AbortSignal.timeout(30000) });
          if (!identity.ok) throw new Error(`GitHub OIDC request failed (${identity.status}).`);
          const { value: idToken } = await identity.json();
          console.log(`::add-mask::${idToken}`);
          const claims = JSON.parse(Buffer.from(idToken.split(".")[1], "base64url"));
          console.log(JSON.stringify({ package: name, repository: claims.repository, workflow: claims.workflow_ref, subject: claims.sub, environment: claims.environment, event: claims.event_name }));
          const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, { method: "POST", headers: { Authorization: `Bearer ${idToken}` }, signal: AbortSignal.timeout(30000) });
          const body = await response.json();
          if (!response.ok) {
            console.error(`::error::npm rejected trusted publishing for ${name} (${response.status}): ${body.message || "authorization denied"}. Check publisher expiry, repository identity, workflow filename, environment, and allowed actions in npm Settings.`);
            process.exit(1);
          }
          if (!body.token) throw new Error("npm exchange returned no publication token.");
          console.log(`::add-mask::${body.token}`);
          console.log(`npm trusted publishing authorization verified for ${name}.`);
          JS

      - run: npm ci
      - name: Install CLIs for isolated integration checks
        run: npm install --global @getpaseo/cli@0.15.2 @anthropic-ai/claude-code@2.1.300 @openai/codex@0.162.1
      - run: npm run verify
      - run: npm run test:install
      - run: npm pack --dry-run
      - name: Publish or verify the existing package
        timeout-minutes: 50
        env:
          PUBLISH_WORKFLOW_SHA: ${{ github.workflow_sha }}
        # Old tags can predate the verifier. Keep package files at the release tag, but use this workflow's helper.
        # Publish once, then wait for registry integrity and dist-tag verification before release notes.
        run: |
          git show "$PUBLISH_WORKFLOW_SHA:scripts/publish-npm.mjs" > "$RUNNER_TEMP/publish-npm.mjs"
          node "$RUNNER_TEMP/publish-npm.mjs"

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish release notes after npm verification
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            exit 0
          fi
          # Every release gets notes in one format (scripts/release-body.mjs): a beta renders its own changes/
          # fragments, a stable version or a major's rc its curated CHANGELOG.md section. Versions with a prerelease
          # part (v1.1.0-beta.0, v2.0.0-rc.0) are GitHub prereleases and never "Latest".
          case "$RELEASE_TAG" in
            *-*) channel=(--prerelease --latest=false) ;;
            *) channel=(--latest) ;;
          esac
          node scripts/release-body.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Follow-up $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${channel[@]}"
